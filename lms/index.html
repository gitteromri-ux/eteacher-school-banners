<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LMS course completion banners | eTeacher Group</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f6f5f1;color:#172724;font:16px/1.5 system-ui,sans-serif}main,header{max-width:1260px;margin:auto;padding:0 clamp(18px,5vw,70px)}header{padding-top:32px}nav,.bar,.links{display:flex;gap:16px;align-items:center;flex-wrap:wrap}nav{justify-content:space-between;border-bottom:1px solid #c3ccc6;padding-bottom:17px}nav strong{letter-spacing:-.04em;font-size:22px}nav span,.meta,small{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:650}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.05;letter-spacing:-.045em}h1{font-size:clamp(40px,6vw,75px);margin:38px 0 14px}h2{font-size:clamp(32px,4vw,50px)}a{color:inherit;text-underline-offset:4px}.bar{margin:20px 0 34px}.btn,button{display:inline-flex;justify-content:center;align-items:center;border:1px solid #bbc8bd;border-radius:5px;padding:10px 16px;background:white;color:#172724;text-decoration:none;cursor:pointer;min-height:44px;font:600 14px system-ui}.primary{background:#203d34;color:white;border-color:#203d34}section{padding:36px 0 44px;border-top:1px solid #bcc7bd}.meta{color:#50665c;margin-bottom:10px}.stage{display:grid;grid-template-columns:1.32fr 1fr;gap:24px;margin:25px 0 30px;align-items:start}.stage img,.grid img{display:block;width:100%;height:auto;aspect-ratio:2140/1074}figure{margin:0;background:white;border:1px solid #cdd3cc;border-radius:7px;overflow:hidden}figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-weight:650}.copy{border:1px solid #cdd3cc;padding:16px 20px;background:white;border-radius:7px}.links{justify-content:space-between}.copy h3{font-size:17px}.copy textarea{width:100%;height:200px;border:0;background:#f5f6f3;padding:12px;color:#24392e;resize:vertical;font:15px/1.48 system-ui;margin:12px 0 5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}.grid figcaption{font-size:14px}.grid a:last-child{min-height:44px;display:inline-flex;align-items:center}.note{color:#4f6057}.photo{display:block}.btn:hover,button:hover{filter:brightness(.94)}footer{padding:22px 0;border-top:1px solid #bdc8bd;color:#52635b}a:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #267e94;outline-offset:3px}@media(max-width:760px){.stage,.grid{grid-template-columns:1fr}.bar{gap:8px}.copy textarea{height:220px}.grid{gap:18px}nav span{font-size:10px}.stage{gap:16px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><header><nav><strong>eTeacher Group</strong><span>LMS / Developer handoff</span></nav><h1>Course completion banners</h1><p>Use the clean JPG in the LMS. Add the English copy as live text and link “Explore All Courses” to the school website.</p><div class="bar"><a class="btn primary" href="LMS-course-completion-banners.zip" download>Download all files (.zip)</a><a class="btn" href="#longevity">Longevity Life Academy</a><a class="btn" href="#french-atelier">French Atelier</a></div></header><main id="schools"></main><script>
const schools=[["longevity","Longevity Life Academy","Blue-toned cell micrograph","What helps us age well?","Take a closer look at how sleep, movement, and nutrition shape the way we age. Choose the question you want to explore next.","https://www.longevitylifeacademy.com/"],["french-atelier","French Atelier","Daylight photograph of the Eiffel Tower","Where will French take you next?","From ordering at a Paris café to talking about a film you loved, there’s always more to say. Find your next conversation in a French Atelier course.","https://www.frenchatelierlive.com/courses.html"]];
const options=[["01-rosen","01 / Rosen layout"],["02-editorial","02 / Editorial panel"],["03-panoramic","03 / Panoramic layout"]];
for(const [i,[id,name,art,title,body,url]] of schools.entries()){
 const pic=tag=>`${id}-${tag}-2140x1074.jpg?v=photo2`;
 const sec=document.createElement("section");sec.id=id;sec.innerHTML=`<p class="meta">School 0${i+1} / 02 &nbsp; · &nbsp; JPG · 2140 × 1074 px</p><h2>${name}</h2><div class="stage"><figure><a class="photo" href="${pic("background")}"><img src="${pic("background")}" alt="${art}, text-free banner background"></a><figcaption>Text-free background<a class="btn" download href="${pic("background")}">Download JPG</a></figcaption></figure><div class="copy"><div class="links"><h3>English LMS copy</h3><button type="button" aria-live="polite">Copy text</button></div><textarea aria-label="${name} developer copy" readonly>Title: ${title}\n\nBody: ${body}\n\nCTA: Explore All Courses\n\nDestination: ${url}</textarea><div class="links"><a href="${url}" target="_blank" rel="noopener">Open CTA destination ↗</a><a href="${id}-copy.txt" download>Download .txt</a></div></div></div><h3>Designed options</h3><p class="note">Same image and wording. Option 01 follows the Rosen reference.</p><div class="grid">${options.map(([tag,label])=>`<figure><a class="photo" href="${pic(tag)}"><img loading="lazy" src="${pic(tag)}" alt="${name}: ${label}, with English copy"></a><figcaption>${label}<a download href="${pic(tag)}" aria-label="Download ${name} ${label} JPG">JPG ↓</a></figcaption></figure>`).join("")}</div>`;
 document.querySelector("main").append(sec);
 const credit=document.createElement("small");credit.style.cssText="display:block;margin:12px 0;text-transform:none;letter-spacing:0;font-weight:400";credit.innerHTML=id==="longevity"?'Photograph: Tom Deerinck, NIGMS, NIH. <a href="https://commons.wikimedia.org/wiki/File:HeLa-II.jpg">Original micrograph</a>, cropped and toned blue for this banner.':'Photograph: <a href="https://www.frenchatelierlive.com/assets/img/culture/travel-hero.jpg">French Atelier’s travel collection</a>.';sec.append(credit);
 const btn=sec.querySelector("button"),box=sec.querySelector("textarea");btn.onclick=async()=>{try{await navigator.clipboard.writeText(box.value);btn.textContent="Copied"}catch{box.select();btn.textContent=document.execCommand("copy")?"Copied":"Select and copy"}setTimeout(()=>btn.textContent="Copy text",1800)};
}
document.querySelector(".primary").href="LMS-course-completion-banners.zip?v=photo2";
</script></body></html>
